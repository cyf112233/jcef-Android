name: build-plugin

on:
  workflow_dispatch:
  push:
    paths:
      - "mcef-android/**"
      - ".github/workflows/build-plugin.yml"

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcef-android
    steps:
      - uses: actions/checkout@v4

      # runner 镜像自带 SDK；setup-android@v3 在这套环境里会退 1，所以直接用它
      - name: Install platform 37 and NDK 27
        run: |
          SDK="$ANDROID_SDK_ROOT"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $SDK/cmdline-tools/*/bin/sdkmanager | head -1)"
          echo "using $SDKM"
          JAVA17="$(ls -d /usr/lib/jvm/*17* 2>/dev/null | head -1)"
          if [ -n "$JAVA17" ]; then export JAVA_HOME="$JAVA17"; fi
          java -version 2>&1 | head -1
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDKM" --sdk_root="$SDK" --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
          ls "$SDK/ndk/27.2.12479018" | head -3

      # Cefrium 0.17.0 的 AAR 是 class-file 69（Java 25），低版本 JDK dex 不了
      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Build libmcef.so
        run: |
          chmod +x scripts/build-native.sh
          ./scripts/build-native.sh arm64-v8a

      - name: Assemble plugin APK
        run: gradle :cefhost:assembleDebug --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: mcef-host-debug-apk
          path: mcef-android/cefhost/build/outputs/apk/debug/*.apk
          retention-days: 14

