name: build-plugin

on:
  workflow_dispatch:
  push:
    paths:
      - "mcef-android/**"
      - ".github/workflows/build-plugin.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcef-android
    steps:
      - uses: actions/checkout@v4

      # Cefrium 0.17.0 的 AAR 里是 class-file 69（Java 25），低于这个版本的 JDK 读不了
      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - name: Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install platform 37 and NDK 27
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mcef-android/**/*.gradle.kts') }}

      - name: Build libmcef.so
        run: |
          chmod +x scripts/build-native.sh
          ./scripts/build-native.sh arm64-v8a

      - name: Assemble plugin APK
        run: |
          gradle :cefhost:assembleRelease --no-daemon
        env:
          ORG_GRADLE_PROJECT_android_signingStore: ${{ secrets.MCEF_KEYSTORE }}

      - uses: actions/upload-artifact@v4
        with:
          name: mcef-host-apk
          path: mcef-android/cefhost/build/outputs/apk/release/*.apk
          retention-days: 14
