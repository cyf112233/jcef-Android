name: build-plugin

on:
  workflow_dispatch:
  push:
    paths:
      - "mcef-android/**"
      - ".github/workflows/build-plugin.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcef-android
    steps:
      - uses: actions/checkout@v4

      # 先装 SDK：sdkmanager 16.0 在 JDK 25 上会退 1，这一步用 runner 自带的 JDK 17
      - uses: android-actions/setup-android@v3

      - name: Install platform 37 and NDK 27
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          sdkmanager --list_installed | sed -n "1,40p"

      # Cefrium 0.17.0 的 AAR 是 class-file 69（Java 25），低版本 JDK dex 不了
      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-...-hash
          restore-keys: gradle-

      - name: Build libmcef.so
        run: |
          chmod +x scripts/build-native.sh
          ./scripts/build-native.sh arm64-v8a

      - name: Assemble plugin APK
        run: gradle :cefhost:assembleDebug --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: mcef-host-debug-apk
          path: mcef-android/cefhost/build/outputs/apk/debug/*.apk
          retention-days: 14

